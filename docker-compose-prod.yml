name: parena

x-build: &java-build
  context: ./backend
  dockerfile: Dockerfile

services:
  # -------------------------------------------------------------------
  # NGINX PROXY MANAGER: Dış Dünyaya Açık Tek Kapı (SSL Kalkanı)
  # -------------------------------------------------------------------
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    ports:
      - '80:80'   # Let's Encrypt SSL doğrulaması için şarttır
      - '443:443' # Gerçek şifreli HTTPS trafiği için şarttır
      - '81:81'   # NPM Panel girişi (İşiniz bitince cloud firewall'dan kapatabilirsiniz)
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - parena
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------- Infrastructure Services ----------------
  keycloak_db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${SO_KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${SO_KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloakdb_vol:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SO_KEYCLOAK_DB_USER} -d keycloak" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: keycloak
    depends_on:
      keycloak_db:
        condition: service_healthy
    command:
      - start-dev
      - --http-enabled=true
      - --http-port=8585
      - --spi-theme-welcome-theme=keycloak
    expose:
      - "8585"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: ${SO_KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${SO_KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SO_KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SO_KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # GÜVENLİK VE PROXY SIKILAŞTIRMASI:
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200' <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 1.5g
          cpus: '1.0'

  keycloak_config_cli:
    image: adorsys/keycloak-config-cli:latest-26.5.5
    container_name: keycloak-config-cli
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8585
      KEYCLOAK_USER: ${SO_KEYCLOAK_ADMIN}
      KEYCLOAK_PASSWORD: ${SO_KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: "/config/*.yaml"
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      SO_BFF_CLIENT_SECRET: ${SO_BFF_CLIENT_SECRET}
      SO_USER_SERVICE_CLIENT_SECRET: ${SO_USER_SERVICE_CLIENT_SECRET}
      SO_BFF_BASE_URL: ${SO_BFF_BASE_URL}
      SO_FRONTEND_BASE_URL: ${SO_FRONTEND_BASE_URL}
      SO_SMTP_USER: ${SO_SMTP_USER}
      SO_SMTP_PASSWORD: ${SO_SMTP_PASSWORD}
    volumes:
      - ./backend/configurations/keycloak:/config
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: [ "redis-server", "--requirepass", "${SO_REDIS_PASSWORD}" ]
    volumes:
      - redis_vol:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${SO_REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ---------------- Platform Services ----------------
  config-server:
    build:
      <<: *java-build
      args:
        MODULE: config-server
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8787/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    container_name: config-server
    environment:
      SO_CONFIG_GIT_URI: ${SO_CONFIG_GIT_URI}
      SO_CONFIG_GIT_BRANCH: ${SO_CONFIG_GIT_BRANCH}
      SO_CONFIG_SECURITY_USER: ${SO_CONFIG_SECURITY_USER}
      SO_CONFIG_SECURITY_PASSWORD: ${SO_CONFIG_SECURITY_PASSWORD}
      SO_SPRING_PROFILES_ACTIVE: ${SO_SPRING_PROFILES_ACTIVE}
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  discovery-server:
    build:
      <<: *java-build
      args:
        MODULE: discovery-server
    expose:
      - "8761"
    container_name: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SO_CONFIG_SECURITY_USER: ${SO_CONFIG_SECURITY_USER}
      SO_CONFIG_SECURITY_PASSWORD: ${SO_CONFIG_SECURITY_PASSWORD}
      SO_SPRING_PROFILES_ACTIVE: ${SO_SPRING_PROFILES_ACTIVE}
      SO_CONFIG_URI: ${SO_CONFIG_URI}
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  gateway-server:
    build:
      <<: *java-build
      args:
        MODULE: gateway-server
    expose:
      - "8888"
    container_name: gateway-server
    depends_on:
      - config-server
      - discovery-server
    environment:
      SO_CONFIG_SECURITY_USER: ${SO_CONFIG_SECURITY_USER}
      SO_CONFIG_SECURITY_PASSWORD: ${SO_CONFIG_SECURITY_PASSWORD}
      SO_SPRING_PROFILES_ACTIVE: ${SO_SPRING_PROFILES_ACTIVE}
      SO_CONFIG_URI: ${SO_CONFIG_URI}
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '0.5'

  bff-server:
    build:
      <<: *java-build
      args:
        MODULE: bff-server
    expose:
      - "8989"
    container_name: bff-server
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      SO_CONFIG_SECURITY_USER: ${SO_CONFIG_SECURITY_USER}
      SO_CONFIG_SECURITY_PASSWORD: ${SO_CONFIG_SECURITY_PASSWORD}
      SO_SPRING_PROFILES_ACTIVE: ${SO_SPRING_PROFILES_ACTIVE}
      SO_CONFIG_URI: ${SO_CONFIG_URI}
      SO_REDIS_PASSWORD: ${SO_REDIS_PASSWORD}
      SO_BFF_CLIENT_SECRET: ${SO_BFF_CLIENT_SECRET}
      SO_FRONTEND_BASE_URL: ${SO_FRONTEND_BASE_URL}
      SO_BFF_BASE_URL: ${SO_BFF_BASE_URL}
      SO_KEYCLOAK_DEV_HOSTNAME: ${SO_KEYCLOAK_DEV_HOSTNAME}
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: '1.0'

  user-service:
    build:
      <<: *java-build
      args:
        MODULE: user-service
    expose:
      - "8080"
    container_name: user-service
    depends_on:
      user_service_db:
        condition: service_healthy
    environment:
      SO_CONFIG_SECURITY_USER: ${SO_CONFIG_SECURITY_USER}
      SO_CONFIG_SECURITY_PASSWORD: ${SO_CONFIG_SECURITY_PASSWORD}
      SO_SPRING_PROFILES_ACTIVE: ${SO_SPRING_PROFILES_ACTIVE}
      SO_CONFIG_URI: ${SO_CONFIG_URI}
      SO_USER_SERVICE_DB_USER: ${SO_USER_SERVICE_DB_USER}
      SO_USER_SERVICE_DB_PASSWORD: ${SO_USER_SERVICE_DB_PASSWORD}
      SO_USER_SERVICE_CLIENT_SECRET: ${SO_USER_SERVICE_CLIENT_SECRET}
      SO_FRONTEND_BASE_URL: ${SO_FRONTEND_BASE_URL}
      SO_KEYCLOAK_DEV_HOSTNAME: ${SO_KEYCLOAK_DEV_HOSTNAME}
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # ---------------- DB(PostgreSQL) Services ----------------
  user_service_db:
    image: postgres:16
    container_name: user-service-db
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: ${SO_USER_SERVICE_DB_USER}
      POSTGRES_PASSWORD: ${SO_USER_SERVICE_DB_PASSWORD}
    expose:
      - "5432"
    volumes:
      - userservicedb_vol:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SO_USER_SERVICE_DB_USER} -d user_service" ]
      interval: 5s
      timeout: 3s
    networks: [ parena ]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

volumes:
  keycloakdb_vol:
  redis_vol:
  userservicedb_vol:

networks:
  parena:
    driver: bridge
