spring:
  application:
    name: config-server
  profiles:
    active: dev
  cloud:
    config:
      server:
        git:
          uri: https://github.com/parenatr/parena.git
          default-label: main
          search-paths:
            - configurations/
            - configurations/{application}
          force-pull: true
          clone-on-start: true

server:
  port: 8787