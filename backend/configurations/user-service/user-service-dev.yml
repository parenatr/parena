#eureka client localdeki eureka servera bağlansın.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

#user-service keycloak bağlantısı.
keycloak:
  realm: ${SO_KEYCLOAK_REALM}
  auth-server-url: ${SO_KEYCLOAK_AUTH_SERVER_URL}
  admin-client-id: ${SO_KEYCLOAK_ADMIN_CLIENT_ID}
  admin-client-secret: ${SO_KEYCLOAK_ADMIN_CLIENT_SECRET}

