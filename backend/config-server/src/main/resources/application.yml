spring:
  application:
    name: config-server
  profiles:
    active: dev
  cloud:
    config:
      server:
        git:
          uri: ${SO_CONFIG_GIT_URI}
          default-label: ${SO_CONFIG_GIT_BRANCH:main}
          username: ${SO_CONFIG_GIT_USERNAME}
          password: ${SO_CONFIG_GIT_TOKEN}
          search-paths:
            - backend/configurations/
            - backend/configurations/{application}
          force-pull: true
          clone-on-start: true

server:
  port: 8787