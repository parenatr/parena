name: Build and Push Keycloak Custom Image

# Neden 'on'? Bu workflow'un ne zaman otomatik tetikleneceğini belirler.
on:
  push:
    branches:
      - main # veya 'master' - ana dalınıza kod push edildiğinde çalışır
    paths:
      - "frontend/app/**" # Sadece frontend/app veya Dockerfile.keycloak
      - "Dockerfile.keycloak" # değiştiğinde boşuna çalışmasın diye kısıtlıyoruz.
      - ".github/workflows/build-keycloak.yml"
  workflow_dispatch: # GitHub panelinden butona basarak MANUEL de başlatabilmenizi sağlar.

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub'ın bize sağladığı geçici Sanal Sunucu

    permissions:
      contents: read
      packages: write # GHCR üzerine Docker imajı yükleyebilmek için yazma izni veriyoruz.

    steps:
      # 1. Adım: Kodları GitHub sunucusuna çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Adım: Docker Buildx aracını kur (Çok katmanlı buildler için gereklidir)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Adım: GitHub Container Registry (GHCR)'e Giriş Yap
      # GitHub'ın otomatik sağladığı ${{ secrets.GITHUB_TOKEN }} kullanıyoruz, harici şifre gerekmez.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Adım: Docker Image'ını Build et ve GHCR'e Yükle (Push)
      - name: Build and push Keycloak Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.keycloak
          push: true
          # Imaj etiketini tanımlıyoruz: ghcr.io/parenatr/parena-keycloak:latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/parena-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/parena-keycloak:${{ github.sha }}
          # Build sürecini hızlandırmak için önbellekleme (cache) mekanizması
          cache-from: type=gha
          cache-to: type=gha,mode=max
