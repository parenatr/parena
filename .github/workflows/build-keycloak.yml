name: Build and Push Keycloak Custom Image

on:
  push:
    branches:
      - main
    paths:
      - "frontend/app/**"
      - "Dockerfile.keycloak"
      - ".github/workflows/build-keycloak.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Keycloak Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.keycloak
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/parena-keycloak:latest
            ghcr.io/${{ github.repository_owner }}/parena-keycloak:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
